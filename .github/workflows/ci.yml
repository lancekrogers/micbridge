name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (hardware-free)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install Linux native build prerequisites
        run: |
          # CGO/miniaudio (malgo) and ALSA headers for future capture builds.
          # No physical USB audio device is required for CI.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev

      - name: Bootstrap
        run: just bootstrap

      - name: Install pinned review tooling
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Format, vet, unit tests
        run: just check

      - name: Race tests
        run: just test-race

      - name: Build
        run: just build

      - name: Demo smoke (temp state dir)
        run: just demo

      - name: Review gate (lint + race)
        env:
          MICBRIDGE_REQUIRE_LINT: "1"
        run: just review

      - name: Parser fuzz smoke
        run: just xtest fuzz-smoke

      - name: Reproducible Linux package candidate
        env:
          VERSION: 0.1.0-ci
        run: just xrelease package-candidate

      - name: Confirm hardware tests are not in default CI
        run: |
          if just xdev hil-smoke; then
            echo "HIL smoke must remain opt-in and fail without hardware in bootstrap"
            exit 1
          fi
          echo "HIL remains opt-in (expected failure without hardware)"
